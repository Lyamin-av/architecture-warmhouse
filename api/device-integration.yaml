openapi: 3.0.3
info:
  title: Интеграция приборов (Device Integration Service)
  version: 1.0.0
  description: |
    API микросервиса «Интеграция приборов»: каталог моделей приборов и адаптеры
    протоколов (anti-corruption layer между протоколами партнёров и единой моделью).

    В этой спецификации описан один асинхронный эндпоинт — передача команды прибору.
    Адаптер выбирается по модели прибора внутри сервиса.
    Результат от прибора публикуется в брокер внутренним событием
    «результат команды от адаптера» (с `commandId`); на него подписана только «Телематика».

    Вызывающий: «Телематика».
servers:
  - url: http://device-integration-service
    description: Внутренний адрес сервиса
security:
  - bearerAuth: []
tags:
  - name: Адаптеры протоколов
paths:
  /commands:
    post:
      tags: [Адаптеры протоколов]
      operationId: dispatchCommand
      summary: Передать команду прибору через адаптер протокола
      description: |
        По `deviceModelId` находит модель прибора и его адаптер, сопоставляет команду единой модели
        с командой модели по каталогу, переводит её в протокол партнёра и отправляет прибору.
        Ответ не ждёт выполнения на приборе.
      parameters:
        - name: X-Correlation-Id
          in: header
          required: false
          description: Сквозной идентификатор цепочки вызовов (для журналов и события с результатом)
          schema:
            type: string
            format: uuid
            example: 0f1e2d3c-4b5a-4968-8776-655443322110
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdapterCommandRequest'
            example:
              commandId: 4e5f6a7b-8c9d-4e0f-a1b2-c3d4e5f6a7b8
              deviceId: 9a8b7c6d-5e4f-4a3b-2c1d-0e9f8a7b6c5d
              deviceModelId: 3d4e5f6a-7b8c-4d9e-0f1a-2b3c4d5e6f7a
              address: 'zigbee:0x00124b0018e2a1f3'
              commandCode: set_target_temperature
              parameters:
                value: 22.0
      responses:
        '202':
          description: Команда передана адаптеру; результат придёт событием «результат команды от адаптера»
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdapterCommandAccepted'
              example:
                commandId: 4e5f6a7b-8c9d-4e0f-a1b2-c3d4e5f6a7b8
                adapterId: 8d9e0f1a-2b3c-4d4e-5f6a-7b8c9d0e1f2a
                acceptedAt: '2026-10-01T18:30:01Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Модель прибора не найдена в каталоге
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://warmhouse.example/problems/not-found
                title: Модель прибора не найдена
                status: 404
                detail: Модель 3d4e5f6a-7b8c-4d9e-0f1a-2b3c4d5e6f7a отсутствует в каталоге
                instance: /commands
                correlationId: 0f1e2d3c-4b5a-4968-8776-655443322110
        '422':
          description: Модель прибора не поддерживает команду или параметры не соответствуют схеме
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AdapterCommandRequest:
      type: object
      required: [commandId, deviceId, deviceModelId, address, commandCode]
      properties:
        commandId:
          type: string
          format: uuid
          description: Идентификатор команды из журнала «Телематики»; вернётся в событии с результатом
        deviceId:
          type: string
          format: uuid
        deviceModelId:
          type: string
          format: uuid
          description: Модель прибора из каталога; по нему выбирается адаптер
        address:
          type: string
          description: Адрес прибора в протоколе партнёра (из настроек прибора)
        commandCode:
          type: string
          description: Код команды из единой модели команд категории; адаптер переводит её в команду модели («Команда модели») и протокол партнёра
        parameters:
          type: object
          additionalProperties: true
          description: Параметры команды по схеме из каталога
    AdapterCommandAccepted:
      type: object
      required: [commandId, adapterId, acceptedAt]
      properties:
        commandId:
          type: string
          format: uuid
        adapterId:
          type: string
          format: uuid
          description: Выбранный адаптер протокола (для журналов)
        acceptedAt:
          type: string
          format: date-time
    Problem:
      type: object
      description: Описание ошибки (RFC 7807)
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          description: Путь запроса, на котором возникла ошибка
        correlationId:
          type: string
          format: uuid
          description: X-Correlation-Id запроса — для поиска в журналах
  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Нет или недействителен токен
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalServerError:
      description: |
        Внутренняя ошибка сервиса (например, недоступна его БД или зависимый
        сервис). Запрос можно повторить позже.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://warmhouse.example/problems/internal-error
            title: Внутренняя ошибка сервиса
            status: 500
            detail: Не удалось выполнить запрос, повторите позже
            instance: /commands
            correlationId: 0f1e2d3c-4b5a-4968-8776-655443322110
